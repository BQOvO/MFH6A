name: Check

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: hashFiles('pyproject.toml') != ''
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v9.0.0
        if: hashFiles('pyproject.toml') != ''
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # picomatch <=4.0.7 (ReDoS) has no patched release on npm yet, so the gate
      # would fail on something nobody can fix. --ignore-unfixable only skips
      # advisories with no fix available; anything fixable still fails the job,
      # and this stops skipping automatically once a patched version ships.
      - run: pnpm audit --audit-level high --ignore-unfixable
      - run: pnpm check
      - run: pnpm check:py
        if: hashFiles('pyproject.toml') != ''
      - run: pnpm release:dry-run
